name: Build and Deploy PDF

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest

    steps:
      - uses: actions/checkout@v4

      - name: Build paper/main.pdf
        run: make

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/main.pdf
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Deploy from main only, not from pull requests.
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download PDF from build job
        uses: actions/download-artifact@v4
        with:
          name: paper
          path: .

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare pages directory
        run: |
          mkdir -p pages
          cp main.pdf pages/paper.pdf

      - name: Upload PDF to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
